name: build

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "ingest/**"
      - "engine/**"
      - "docs/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 10 * * *" # 10:00 UTC daily (GitHub may delay cron on quiet repos)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache nflverse history seasons
        uses: actions/cache@v4
        with:
          path: .cache/nflverse
          key: nflverse-${{ hashFiles('config/leagues/*.yml') }}

      - run: pip install -r requirements.txt

      - run: pytest -q

      - name: Run pipeline
        env:
          PYTHONIOENCODING: utf-8
          ESPN_S2_AGS: ${{ secrets.ESPN_S2_AGS }}
          SWID_AGS: ${{ secrets.SWID_AGS }}
        run: python -m engine.pipeline

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
