<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stackademics</title>
  <meta name="description" content="Fantasy football roster analytics - points-above-replacement player valuation, trade calculator, start/sit optimizer, matchup grids, waiver/FAAB estimates, and playoff-odds simulation." />
  <meta name="theme-color" content="#0057fd" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app-top" class="app-top">
    <header class="app-header">
      <div class="app-brand">
        <img src="icons/icon-192.png" alt="" class="app-logo" />
        <span class="app-name">Stackademics</span>
      </div>
      <select id="league-select"></select>
    </header>
    <div id="warning-banner" class="warning-banner" hidden></div>

    <nav class="tabs">
      <button data-tab="strength" class="active">Team Strength</button>
      <button data-tab="startsit">Start/Sit</button>
      <button data-tab="rankings">Rankings</button>
      <button data-tab="trade">Trade Calculator</button>
      <button data-tab="matchups">Matchups</button>
      <button data-tab="schedule">Schedule</button>
      <button data-tab="standings">Standings</button>
      <button data-tab="trends">Trends</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </div>

  <section class="tabpanel active" id="tab-strength"></section>
  <section class="tabpanel" id="tab-startsit"></section>
  <section class="tabpanel" id="tab-rankings"></section>
  <section class="tabpanel" id="tab-trade"></section>
  <section class="tabpanel" id="tab-matchups"></section>
  <section class="tabpanel" id="tab-schedule"></section>
  <section class="tabpanel" id="tab-standings"></section>
  <section class="tabpanel" id="tab-trends"></section>
  <section class="tabpanel" id="tab-settings"></section>

  <footer id="app-footer" class="app-footer">
    <div id="footer-updates" class="footer-updates"></div>
  </footer>

  <script src="js/trade.js"></script>
  <!-- Trends tab's chart rendering (docs/js/trends.js) - the one external
       dependency on this otherwise framework-free site, since every other
       graphic here is hand-rolled divs/CSS and none needed a flexible
       multi-series, dual-axis, mixed line/bar chart before. UMD build, no
       build step, loaded as a plain global (window.Chart) same as this
       site's own non-module scripts. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
